<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HANUMAN</title>
  <style>
    /* ── Reset & Base ─────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #07090f;
      --surface:   #0d1117;
      --border:    rgba(255,255,255,0.06);
      --text:      #c8d6e5;
      --muted:     #4a5568;
      --cyan:      #00d4ff;
      --blue:      #3b82f6;
      --purple:    #7c3aed;
      --magenta:   #d946ef;
      --gold:      #f59e0b;
      --green:     #10b981;
      --red:       #ef4444;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      overflow: hidden;
    }

    /* ── Layout ───────────────────────────────────────────────────────── */
    .hud {
      display: grid;
      grid-template-rows: 48px 1fr 200px;
      height: 100vh;
      max-width: 900px;
      margin: 0 auto;
      padding: 0 24px 24px;
    }

    /* ── Top Bar ──────────────────────────────────────────────────────── */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .topbar .wordmark {
      color: var(--cyan);
      letter-spacing: 0.25em;
      font-size: 12px;
    }

    .topbar .indicators {
      display: flex;
      gap: 24px;
      align-items: center;
    }

    .indicator {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--muted);
    }

    .dot.online  { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .dot.offline { background: var(--red); }
    .dot.away    { background: var(--gold); box-shadow: 0 0 6px var(--gold); }

    /* ── Centre Stage ─────────────────────────────────────────────────── */
    .stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      position: relative;
    }

    /* ── Waveform Canvas ──────────────────────────────────────────────── */
    .canvas-wrap {
      position: relative;
      width: 260px;
      height: 260px;
    }

    #waveCanvas {
      position: absolute;
      inset: 0;
    }

    /* ── Status Label ─────────────────────────────────────────────────── */
    .status-label {
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      transition: color 0.4s;
      min-height: 16px;
    }

    .status-label.listening { color: var(--cyan); }
    .status-label.thinking  { color: var(--blue); }
    .status-label.speaking  { color: var(--magenta); }

    /* ── Last Utterance ───────────────────────────────────────────────── */
    .last-utterance {
      font-size: 14px;
      color: var(--text);
      text-align: center;
      max-width: 520px;
      line-height: 1.6;
      min-height: 22px;
      opacity: 0.85;
      transition: opacity 0.3s;
    }

    /* ── Transcript ───────────────────────────────────────────────────── */
    .transcript {
      border-top: 1px solid var(--border);
      padding-top: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      scrollbar-width: none;
    }

    .transcript::-webkit-scrollbar { display: none; }

    .turn {
      display: flex;
      gap: 10px;
      font-size: 12px;
      line-height: 1.5;
      animation: fadein 0.3s ease;
    }

    @keyframes fadein {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .turn .role {
      flex-shrink: 0;
      width: 72px;
      text-align: right;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 10px;
      padding-top: 2px;
    }

    .turn.user     .role { color: var(--blue); }
    .turn.assistant .role { color: var(--cyan); }

    .turn .content {
      color: var(--text);
      opacity: 0.8;
    }

    /* ── Text Input ───────────────────────────────────────────────────── */
    .input-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .input-row input {
      flex: 1;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      font-family: inherit;
      font-size: 12px;
      padding: 6px 0;
      outline: none;
      letter-spacing: 0.05em;
    }

    .input-row input::placeholder { color: var(--muted); }

    .input-row input:focus { border-bottom-color: var(--cyan); }

    .send-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: inherit;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 6px 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .send-btn:hover { border-color: var(--cyan); color: var(--cyan); }

    /* ── Mode Badge ───────────────────────────────────────────────────── */
    .mode-badge {
      padding: 2px 8px;
      border: 1px solid currentColor;
      border-radius: 2px;
      font-size: 10px;
      letter-spacing: 0.15em;
    }

    .mode-NORMAL   { color: var(--cyan); }
    .mode-FOCUS    { color: var(--blue); }
    .mode-NIGHT    { color: var(--purple); }
    .mode-WINDDOWN { color: var(--gold); }
    .mode-MOODY    { color: var(--magenta); }
    .mode-MORNING  { color: var(--gold); }
    .mode-AWAY     { color: var(--muted); }
  </style>
</head>
<body>
  <div class="hud">

    <!-- Top Bar -->
    <div class="topbar">
      <span class="wordmark">H·A·N·U·M·A·N</span>
      <div class="indicators">
        <div class="indicator">
          <div class="dot" id="presenceDot"></div>
          <span id="presenceLabel">away</span>
        </div>
        <div class="indicator mode-badge mode-NORMAL" id="modeBadge">NORMAL</div>
        <div class="indicator">
          <div class="dot online" id="connectionDot"></div>
          <span id="connectionLabel">online</span>
        </div>
      </div>
    </div>

    <!-- Centre Stage -->
    <div class="stage">
      <div class="canvas-wrap">
        <canvas id="waveCanvas" width="260" height="260"></canvas>
      </div>
      <div class="status-label" id="statusLabel">standby</div>
      <div class="last-utterance" id="lastUtterance"></div>
    </div>

    <!-- Transcript + Input -->
    <div style="display:flex; flex-direction:column; gap:0; overflow:hidden;">
      <div class="transcript" id="transcript"></div>
      <div class="input-row">
        <input type="text" id="textInput" placeholder="type a command..." autocomplete="off" />
        <button class="send-btn" id="sendBtn">send</button>
      </div>
    </div>

  </div>

  <script>
  // ── State ────────────────────────────────────────────────────────────────
  const state = {
    status:   'idle',      // idle | listening | thinking | speaking
    mode:     'NORMAL',
    presence: 'away',
    volume:   0.85,
    connected: false,
  };

  // ── WebSocket ────────────────────────────────────────────────────────────
  let ws = null;
  let reconnectTimer = null;

  function connect() {
    const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${protocol}://${location.host}/ws`);

    ws.onopen = () => {
      setState({ connected: true });
      clearTimeout(reconnectTimer);
    };

    ws.onmessage = (evt) => {
      const msg = JSON.parse(evt.data);
      if (msg.type === 'state') {
        setState(msg);
      } else if (msg.type === 'message') {
        addTurn(msg.role, msg.text);
        if (msg.role === 'assistant') setLastUtterance(msg.text);
      }
    };

    ws.onclose = () => {
      setState({ connected: false });
      reconnectTimer = setTimeout(connect, 3000);
    };

    ws.onerror = () => ws.close();
  }

  function sendText(text) {
    if (!text.trim()) return;
    addTurn('user', text);
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'text', text }));
    }
  }

  connect();

  // ── UI Updates ───────────────────────────────────────────────────────────
  function setState(patch) {
    Object.assign(state, patch);
    renderStatus();
    renderMode();
    renderPresence();
    renderConnection();
  }

  function renderStatus() {
    const el = document.getElementById('statusLabel');
    el.textContent = state.status;
    el.className = 'status-label ' + state.status;
  }

  function renderMode() {
    const el = document.getElementById('modeBadge');
    el.textContent = state.mode;
    el.className = 'indicator mode-badge mode-' + state.mode;
  }

  function renderPresence() {
    const dot   = document.getElementById('presenceDot');
    const label = document.getElementById('presenceLabel');
    label.textContent = state.presence;
    dot.className = 'dot ' + (state.presence === 'home' ? 'online' : 'away');
  }

  function renderConnection() {
    const dot   = document.getElementById('connectionDot');
    const label = document.getElementById('connectionLabel');
    dot.className  = 'dot ' + (state.connected ? 'online' : 'offline');
    label.textContent = state.connected ? 'online' : 'offline';
  }

  function setLastUtterance(text) {
    document.getElementById('lastUtterance').textContent = text;
  }

  function addTurn(role, text) {
    const t = document.getElementById('transcript');
    const div = document.createElement('div');
    div.className = 'turn ' + role;
    div.innerHTML = `
      <span class="role">${role === 'assistant' ? 'hanuman' : 'you'}</span>
      <span class="content">${escHtml(text)}</span>`;
    t.appendChild(div);
    t.scrollTop = t.scrollHeight;
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ── Input ────────────────────────────────────────────────────────────────
  document.getElementById('sendBtn').addEventListener('click', () => {
    const inp = document.getElementById('textInput');
    sendText(inp.value);
    inp.value = '';
  });

  document.getElementById('textInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('sendBtn').click();
  });

  // ── Waveform Canvas ──────────────────────────────────────────────────────
  const canvas  = document.getElementById('waveCanvas');
  const ctx     = canvas.getContext('2d');
  const CX      = canvas.width  / 2;
  const CY      = canvas.height / 2;
  const RADIUS  = 80;   // inner circle radius
  const BARS    = 120;  // number of radial bars
  const BAR_MAX = 42;   // max bar length (px)

  // Smoothed amplitude values for each bar
  const amplitudes = new Float32Array(BARS).fill(0);

  // Multicolor palette — hue cycles around the circle
  function barColor(i, amp) {
    const hue = (i / BARS) * 360;
    const lightness = 45 + amp * 25;
    return `hsl(${hue}, 90%, ${lightness}%)`;
  }

  // Noise generator for realistic waveform simulation
  let noiseOffset = 0;
  function noise(x) {
    return (Math.sin(x * 2.3) + Math.sin(x * 1.7) + Math.sin(x * 3.1)) / 3;
  }

  let animFrame = null;
  let phase = 0;

  function draw() {
    animFrame = requestAnimationFrame(draw);
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const s = state.status;
    phase += 0.04;

    // ── Target amplitudes by state ────────────────────────────────────
    for (let i = 0; i < BARS; i++) {
      let target = 0;
      const angle = (i / BARS) * Math.PI * 2;

      if (s === 'speaking') {
        // Rich, varied waveform when speaking
        const n = noise(i * 0.15 + noiseOffset);
        const pulse = (Math.sin(phase * 2 + i * 0.1) + 1) / 2;
        target = (Math.abs(n) * 0.6 + pulse * 0.4) * BAR_MAX;
        noiseOffset += 0.003;
      } else if (s === 'listening') {
        // Gentle inward pulse
        const pulse = (Math.sin(phase * 1.5 + i * 0.05) + 1) / 2;
        target = pulse * BAR_MAX * 0.18;
      } else if (s === 'thinking') {
        // Slow rotating sweep
        const sweep = (Math.sin(angle - phase * 1.2) + 1) / 2;
        target = sweep * BAR_MAX * 0.25;
      } else {
        // Idle: very faint breathing ring
        target = (Math.sin(phase * 0.6) + 1) / 2 * BAR_MAX * 0.06;
      }

      // Smooth towards target
      const speed = s === 'speaking' ? 0.25 : 0.1;
      amplitudes[i] += (target - amplitudes[i]) * speed;
    }

    // ── Draw bars ────────────────────────────────────────────────────
    for (let i = 0; i < BARS; i++) {
      const angle  = (i / BARS) * Math.PI * 2 - Math.PI / 2;
      const amp    = amplitudes[i] / BAR_MAX;
      const len    = amplitudes[i];
      const x1     = CX + Math.cos(angle) * RADIUS;
      const y1     = CY + Math.sin(angle) * RADIUS;
      const x2     = CX + Math.cos(angle) * (RADIUS + len);
      const y2     = CY + Math.sin(angle) * (RADIUS + len);

      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.strokeStyle = barColor(i, amp);
      ctx.lineWidth   = 1.8;
      ctx.globalAlpha = 0.5 + amp * 0.5;
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // ── Inner circle ────────────────────────────────────────────────
    const glowSize = s === 'speaking' ? 18 : s === 'listening' ? 10 : 6;
    const glowColor = s === 'speaking' ? 'rgba(217,70,239,0.15)'
                    : s === 'listening' ? 'rgba(0,212,255,0.12)'
                    : s === 'thinking'  ? 'rgba(59,130,246,0.1)'
                    :                    'rgba(0,212,255,0.05)';

    const grad = ctx.createRadialGradient(CX, CY, RADIUS - glowSize, CX, CY, RADIUS + 2);
    grad.addColorStop(0, glowColor);
    grad.addColorStop(1, 'transparent');
    ctx.beginPath();
    ctx.arc(CX, CY, RADIUS + glowSize, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();

    // Circle ring
    ctx.beginPath();
    ctx.arc(CX, CY, RADIUS, 0, Math.PI * 2);
    ctx.strokeStyle = s === 'speaking'  ? 'rgba(217,70,239,0.5)'
                    : s === 'listening' ? 'rgba(0,212,255,0.4)'
                    : s === 'thinking'  ? 'rgba(59,130,246,0.3)'
                    :                    'rgba(255,255,255,0.08)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Centre letter
    ctx.font = 'bold 28px SF Mono, Fira Code, monospace';
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = s === 'speaking'  ? 'rgba(217,70,239,0.85)'
                  : s === 'listening' ? 'rgba(0,212,255,0.85)'
                  : s === 'thinking'  ? 'rgba(59,130,246,0.7)'
                  :                    'rgba(255,255,255,0.15)';
    ctx.fillText('H', CX, CY);
  }

  draw();

  // ── Demo cycle (runs when not connected to backend) ──────────────────────
  // Cycles through states so the UI looks alive before the backend is wired.
  let demoTimer = null;
  const demoStates = ['idle','listening','thinking','speaking','idle'];
  let demoIdx = 0;

  function runDemo() {
    if (state.connected) return;
    setState({ status: demoStates[demoIdx % demoStates.length] });
    const durations = [2000, 2500, 1500, 4000, 1000];
    demoTimer = setTimeout(() => { demoIdx++; runDemo(); }, durations[demoIdx % durations.length]);
  }

  // Start demo after 800ms — gives WebSocket a chance to connect first
  setTimeout(() => { if (!state.connected) runDemo(); }, 800);
  </script>
</body>
</html>
